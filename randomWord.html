<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8ef">
  <title>Random Word | Make Life Funny</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="generator-page">
    <a class="back-link" href="index.html">&larr; Back home</a>
    <section class="generator-card" data-generator="word" aria-labelledby="page-title">
      <p class="eyebrow">A word picked just for you</p>
      <h1 id="page-title">Random word</h1>
      <p class="generator-copy">Add a fresh, delightfully unusual word to your day.<br>You have 10 minutes to learn about this random word, then speak about it for 2 minutes and record yourself.</p>
      <p class="result" data-result aria-live="polite">Ready for a word?</p>
      <button class="generate-button" type="button" data-generate>Give me a word</button>
    </section>
  </main>
</body>
</html>
